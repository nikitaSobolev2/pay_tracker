services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paytracker
      POSTGRES_PASSWORD: paytracker
      POSTGRES_DB: paytracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytracker -d paytracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_CURRENCIES: ${NEXT_PUBLIC_DEFAULT_CURRENCIES:-RUB,USD,EUR}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PayTracker}
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://paytracker:paytracker@postgres:5432/paytracker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-please-32chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DEFAULT_CURRENCIES: ${DEFAULT_CURRENCIES:-RUB,USD,EUR}
      NEXT_PUBLIC_DEFAULT_CURRENCIES: ${NEXT_PUBLIC_DEFAULT_CURRENCIES:-RUB,USD,EUR}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-RUB}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      FX_PROVIDER: frankfurter
      FX_API_BASE_URL: https://api.frankfurter.dev
      NEXT_PUBLIC_APP_NAME: PayTracker
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      YANDEX_GEOCODER_REFERER: ${YANDEX_GEOCODER_REFERER:-}
      STORAGE_BACKEND: fs
      STORAGE_DIR: /data/files
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:3000/files}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.artemox.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_ID: ${AI_MODEL_ID:-gpt-5-nano}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
    volumes:
      - ./data/files:/data/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
