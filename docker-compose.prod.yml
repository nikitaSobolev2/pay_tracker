# Production stack for Ubuntu deploy (used by scripts/deploy-ubuntu.sh).
# Postgres is not published to the host. App listens on APP_HOST:APP_PORT.
# pull_policy: missing — on-server `up --build` must not contact GHCR.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paytracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-paytracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-paytracker} -d ${POSTGRES_DB:-paytracker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/nikitasobolev2/pay_tracker:${PAYTRACKER_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_CURRENCIES: ${NEXT_PUBLIC_DEFAULT_CURRENCIES:-RUB,USD,EUR}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PayTracker}
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
    restart: unless-stopped
    mem_limit: 768m
    ports:
      # Loopback by default: nginx terminates TLS and proxies to 127.0.0.1.
      # Publishing on 0.0.0.0 would expose the app directly, bypassing TLS.
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paytracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paytracker}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      DEFAULT_CURRENCIES: ${DEFAULT_CURRENCIES:-RUB,USD,EUR}
      NEXT_PUBLIC_DEFAULT_CURRENCIES: ${NEXT_PUBLIC_DEFAULT_CURRENCIES:-RUB,USD,EUR}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-RUB}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      FX_PROVIDER: ${FX_PROVIDER:-frankfurter}
      FX_API_BASE_URL: ${FX_API_BASE_URL:-https://api.frankfurter.dev}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PayTracker}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      YANDEX_GEOCODER_REFERER: ${YANDEX_GEOCODER_REFERER:-}
      FX_BACKFILL_DAYS: ${FX_BACKFILL_DAYS:-40}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-fs}
      STORAGE_DIR: /data/files
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.artemox.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_ID: ${AI_MODEL_ID:-gpt-5-nano}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
    volumes:
      - files_data:/data/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  files_data:
