# Production stack for Ubuntu deploy (used by scripts/deploy-ubuntu.sh).
# Postgres is not published to the host. App listens on APP_HOST:APP_PORT.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paytracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-paytracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-paytracker} -d ${POSTGRES_DB:-paytracker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_CURRENCIES: ${NEXT_PUBLIC_DEFAULT_CURRENCIES:-RUB,USD,EUR}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PayTracker}
    restart: unless-stopped
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paytracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paytracker}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      DEFAULT_CURRENCIES: ${DEFAULT_CURRENCIES:-RUB,USD,EUR}
      NEXT_PUBLIC_DEFAULT_CURRENCIES: ${NEXT_PUBLIC_DEFAULT_CURRENCIES:-RUB,USD,EUR}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-RUB}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      FX_PROVIDER: ${FX_PROVIDER:-frankfurter}
      FX_API_BASE_URL: ${FX_API_BASE_URL:-https://api.frankfurter.dev}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PayTracker}
    depends_on:
      postgres:
        condition: service_healthy

  fx-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paytracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paytracker}
      DEFAULT_CURRENCIES: ${DEFAULT_CURRENCIES:-RUB,USD,EUR}
      FX_API_BASE_URL: ${FX_API_BASE_URL:-https://api.frankfurter.dev}
      FX_PROVIDER: ${FX_PROVIDER:-frankfurter}
      FX_BACKFILL_DAYS: ${FX_BACKFILL_DAYS:-40}
      FX_FETCH_CRON: ${FX_FETCH_CRON:-0 2 * * *}
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paytracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paytracker}
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/backup-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
