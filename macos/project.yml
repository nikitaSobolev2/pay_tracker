name: PayTracker
options:
  bundleIdPrefix: site.paytracker
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: L68B26P3AA
    CODE_SIGN_STYLE: Automatic
    ENABLE_DEBUG_DYLIB: NO
targets:
  PayTracker:
    type: application
    platform: macOS
    sources:
      - path: PayTracker/App
      - path: PayTracker/Shared
    info:
      path: PayTracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pay Tracker
        LSApplicationCategoryType: public.app-category.finance
        CFBundleURLTypes:
          - CFBundleURLName: site.paytracker.mac
            CFBundleURLSchemes:
              - paytracker
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "4"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.paytracker.mac
        PRODUCT_NAME: PayTracker
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: PayTracker/Resources/PayTracker.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    entitlements:
      path: PayTracker/Resources/PayTracker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.site.paytracker.mac
    dependencies:
      - target: PayTrackerWidget
        embed: true
    scheme:
      gatherCoverageData: false

  PayTrackerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: PayTracker/Widget
      - path: PayTracker/Shared
    info:
      path: PayTracker/Resources/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Pay Tracker
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.paytracker.mac.widget
        PRODUCT_NAME: PayTrackerWidget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: PayTracker/Resources/PayTrackerWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    entitlements:
      path: PayTracker/Resources/PayTrackerWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.site.paytracker.mac
